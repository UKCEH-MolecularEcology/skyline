# NOTE
#   Do NOT push user-specific changes to the repository!
#   Change settings tagged with "USER_INPUT" before using this file.

##################################################
# STEPS

# Steps to be done
steps: ["dereplicate", "comparison"] # OPTIONS: [ "extract", "cluster", "bin_info", "dereplicate", "comparison", "coverage_check", "traits", "amr", "portraits", "bgc", "bgc_families"] # USER_INPUT


##################################################
# INPUT

# dataset tag/name (will be used for some file/folder names)
tag: "test"

# working directory (will include links to raw data, logs, results)
workdir: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline" # USER_INPUT

# directory where the assemblies are stored
ass_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/HiFi/assemblies/SSA"

# internal databases (created by the pipeline; external databases should be defined elsewhere)
dbsdir: "/ei/.project-scratch/0/0e51ef86-0156-4e79-ad12-c5411c0a5496/databases" # USER_INPUT (do NOT change if on iris, HPC @Uni.lu)

# path to store results
results_dir: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results"

# samples (if a relative path, relative to this repo)
samples: "config/samples.tsv" # USER_INPUT

# path to the metadata (if a relative path, relative to this repo)
metadata: "data" # USER_INPUT

# path to 16S ASV file
ASV: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/CEH_soil_project/16S/16s_asvs_v2.fasta"

# path to dereplicated mags folder
drep_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/HiFi/assemblies/mags_with_rhyzo"

# OTU clustering IDs
cluster_ids: [90, 95, 97, 99]

# MAG annotations: steps "coverage_check", "traits", "amr"
annotations:
  # dereplicated MQ MAGs (one FASTA per MAG)
  mags_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95/dereplicated_genomes" # USER_INPUT
  mags_ext: "fa"
  # MAGs per SLURM job for microtrait / RGI / BacMet (per-MAG outputs; finished MAGs are skipped on reruns)
  batch_size: 100
  # envs, containers, tools, caches (setup); results go to results_dir
  work_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95/annotations/susbus" # USER_INPUT
  # outputs
  results_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95/annotations" # USER_INPUT
  # shared databases (CARD -> rgi/, BacMet -> bacmet/); existing files are not re-downloaded
  dbs_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/data/Databases" # USER_INPUT
  # reuse existing prodigal proteins if this file exists, else genes are called (set "" to always call)
  prodigal_existing: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95/prodigal_annotations/{mag}.faa" # USER_INPUT

##################################################
# TOOLS & DATA(BASES)
# Trimming 16S
hyperex:
  cargo_path: "/hpc-home/kar23heg/.cargo/bin"
  path: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/susbus/data/skyline/submodules/hyperex/install/bin"
  bin: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/susbus/data/skyline/submodules/hyperex/install/bin/hyperex"
  fwd: "GTGYCAGCMGCCGCGGTAA"  # 515F, V4
  rev: "GGACTACNVGGGTWTCTAAT" # 806R, V4

# PREPROCESSING
trim_galore:
  threads: 8

# FILTERING 
filter:
  fasta: "/ei/.project-scratch/0/0e51ef86-0156-4e79-ad12-c5411c0a5496/databases/mice_filtering/all_mice_and_human.fa.gz"

# CLASSIFICATION
kraken2:
  url: "https://genome-idx.s3.amazonaws.com/kraken/k2_pluspfp_20230605.tar.gz"
  db: "/hdd0/susbus/databases/kraken2/pluspfp/"
  confidence: 0.5
  contig_confidence: 0.2
  threads: 12
  read: 150
  level: "S" # https://github.com/jenniferlu717/Bracken/issues/117
  contig_level: "P" # set to phylum since many samples were unclassified at the Species, Genus, Family and Order levels

# KAIJU
kaiju:
  url: "https://kaiju-idx.s3.eu-central-1.amazonaws.com/2023/kaiju_db_nr_euk_2023-05-10.tgz"
  threads: 4
  level: "species"
  fmi: "/hdd0/susbus/databases/kaiju/kaiju_db_nr_euk.fmi"
  nodes: "/hdd0/susbus/databases/kaiju/nodes.dmp"
  names: "/hdd0/susbus/databases/kaiju/names.dmp"

# Struo2 database from the Ruth Ley lab
struo2_kraken2:
  db: "/hdd0/susbus/databases/kraken2/"
  threads: 12

# Bracken
# Bracken installed based on information here: https://github.com/jenniferlu717/Bracken
bracken:
  bin: "/hdd0/susbus/tools/Bracken/bracken"
  combine: "/hdd0/susbus/tools/Bracken/analysis_scripts/combine_bracken_outputs.py"

# MEGAHIT
# https://github.com/voutcn/megahit
megahit:
  threads: 12
  coassembly_threads: 70

# DE-DUPLICATION
clumpify:
  threads: 64
  dupedist: 12000
  groups: 50
  memory: "1600g"

# ANNOTATION
prodigal:
  threads: 8

# Eukaryotes
eukulele:
  threads: 64
  db: "phylodb"
  aligner: "diamond"  # options: "blast" or "diamond"
  scratch: "/hdd0/susbus/socd/results/eukulele_scratch"
  ref_dir: "/hdd0/susbus/databases"

# MAPPING
bwa:
  threads: 10
  map_threads: 16

# http://www.htslib.org/doc/samtools.html
samtools:
  sort:
    chunk_size: "4G"
    chunk_size_bigmem: "16G"  

fastani:
  threads: 48
  largemem_threads: 64

# COVERM QC (existing per-sample genome-mode tables: <sample>_output_coverm.tsv)
coverm_check:
  coverm_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/Coverm_output"
  metadata: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/metadata/SkylineSequenceSheet_250314.tsv"
  min_covfrac: 0.1    # MAG counted as present if covered fraction >= this
  max_unmapped: 50    # flag samples with more unmapped reads (%)

# TRAITS
microtrait:
  threads: 16           # genomes processed in parallel within a batch
  genomeset_threads: 16

# AMR
rgi:
  threads: 16
  # official biocontainer (RGI + its prodigal/diamond/blast); run with --use-singularity
  container: "docker://quay.io/biocontainers/rgi:6.0.3--pyha8f3691_0"
  db_url: "https://card.mcmaster.ca/latest/data"
  alignment_tool: "DIAMOND"
  extra: ""           # e.g. "--low_quality" for very fragmented MAGs

# PORTRAITS (https://github.com/grp-bork/porTraits), run per batch of MAGs
portraits:
  repo: "grp-bork/porTraits"
  commit: "2804b21951f9831a7cb990ea833d91c1ac93fccd"   # v0.2.5 (main, 2026-10-07)
  models: "/ei/.project-scratch/0/0e51ef86-0156-4e79-ad12-c5411c0a5496/databases/portraits"
  recognise_markers: "/ei/.project-scratch/0/0e51ef86-0156-4e79-ad12-c5411c0a5496/databases/portraits/recognise_markers"
  eggnog_db: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/data/Databases/eggnog_5.0.2"   # eggNOG 5.0.2 (own copy)
  # eggNOG-mapper as in porTraits (container emapper 2.1.12 + eggNOG 5.0.2 below), run:
  #   "batch"      -- once per batch on all its MAGs' proteins (prodigal_existing), split per MAG (fast)
  #   "per_genome" -- porTraits' own per-genome eggNOG step (very slow at this scale)
  eggnog_mode: "batch"
  eggnog_batch_threads: 64      # cores for the batch eggNOG-mapper job
  eggnog_block_size: 8          # DIAMOND -b: larger = faster, uses more memory (~6-7 GB per unit)
  eggnog_index_chunks: 1        # DIAMOND -c: 1 = fastest, most memory
  local_tmpdir: "/tmp"   # node-local disk for the DIAMOND database copy + eggNOG-mapper temp files
  # Pfam clan table for emapper2matrix (Pfam 31.0 = porTraits default, matches eggNOG 5.0.2)
  pfam_release: "Pfam31.0"
  pfam_clans_url: "http://ftp.ebi.ac.uk/pub/databases/Pfam/releases/Pfam31.0/Pfam-A.clans.tsv.gz"
  images:   # pulled once on the software node into <work_dir>/singularity_cache/portraits
    portraits: "ghcr.io/grp-bork/portraits:v0.2.2"
    recognise: "ghcr.io/grp-bork/recognise:v0.8.0"
    eggnog: "quay.io/biocontainers/eggnog-mapper:2.1.12--pyhdfd78af_2"
  singularity_tmpdir: "/tmp"   # node-local build space for image pulls (needs a few GB free)
  threads: 32
  mem: "120 GB"
  eggnog_cpus: 16
  eggnog_mem: "48 GB"
  max_skipped_frac: 0.05   # batch fails if skipped tasks > 5% of its genomes (work dir kept)

# BGCs (antiSMASH + GECCO), run per batch of MAGs (annotations.batch_size)
bgc:
  antismash:
    image: "antismash/standalone:8.0.4"   # official image, databases included; pulled once on the software node
    parallel: 8                           # MAGs at a time per batch job
    cpus_per_mag: 4
    extra: ""                             # e.g. "--cb-knownclusters --cc-mibig" (slower)
  gecco:
    parallel: 4
    cpus_per_mag: 4
    extra: ""
  max_failed_frac: 0.05                   # a batch fails if more than this fraction of its MAGs fail (per tool)
  singularity_tmpdir: "/tmp"              # node-local build space for the image pull

# BGC families: BiG-SLiCE 2 on all antiSMASH regions (single job)
bgc_families:
  threshold: 0.4          # BiG-SLiCE 2 clustering threshold (cosine distance; default 0.4)
  threads: 32
  extra: ""
  models_url: "https://github.com/medema-group/bigslice/releases/download/v2.0.0rc/bigslice-models.2022-11-30.tar.gz"
  models_md5: "aaabde911ec107d08e5c24f68aaf31d1"

bacmet:
  threads: 16
  db_url: "http://bacmet.biomedicine.gu.se/download/BacMet2_EXP_database.fasta"
  map_url: "http://bacmet.biomedicine.gu.se/download/BacMet2_EXP.753.mapping.txt"
  id: 80
  qcov: 80
  evalue: 1e-5
