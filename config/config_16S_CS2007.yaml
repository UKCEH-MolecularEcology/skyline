# Countryside Survey 2007 16S (Zenodo 10.5281/zenodo.12744255) linked to the MQ_MAGs_all_0.95 dereplicated MAGs.
# Same strategy as config_16S_2026.yaml (long-read 16S -> OTU clustering with the amplicon set -> contig -> MAG),
# with the CS OTUs as the amplicon set and the long-read 16S trimmed to the CS region (V3-V4, 341F/806R).
# Overlay on config.yaml:
#   sbatch sbatch_snakemake.sh run --configfile config/config.yaml config/config_16S_CS2007.yaml
# Everything (inputs in data/, results, run bookkeeping in run/) under results/16S_CS2007/.

steps: ["extract", "cluster", "dereplicate", "cs_profile"]

workdir: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_CS2007/run"          # own status/ + .snakemake/ (does not clash with other runs)
results_dir: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_CS2007"

# long-read 16S: the same 14 lr_results_20260202 assemblies as the 2026 run
samples: "config/samples_lr_20260202.tsv"
ass_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/data/lr_results_20260202/annotation"
asm_16S_path: "{ass_dir}/{sample}/annotation/16S_seqs.fa"

# amplicon set = CS 2007 OTU representative sequences (named OTU<n>; prefixed so they are typed as amplicon)
ASV: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_CS2007/data/repseqs.fasta"
asv_prefix: "ASV_CS_"

# in-silico PCR on the long-read 16S: CS 341F/806R (V3-V4). IUPAC union of the common 341F/806R variants
# (CCTACGGGNGGCWGCAG + CCTAYGGGRBGCASCAG; GGACTACHVGGGTWTCTAAT + GGACTACNNGGGTATCTAAT); primers are excluded (-e)
hyperex:
  fwd: "CCTAYGGGNBGCWSCAG"
  rev: "GGACTACNNGGGTWTCTAAT"

# long-read 16S are extracted in contig orientation: cluster on both strands
cluster_strand: "both"
cluster_ids: [97, 99]          # CS OTUs are 97% OTUs; 99 as a stricter check

# contig -> MAG -> dMAG table: reuse the one built by the 2026 16S run (same assemblies, same MAGs)
drep_dir: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95"
dmag_link:
  build_contig_table: false
  contig_table: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_2026/dereplicated_OTU/contig_MAGs_dMAGs.tsv"
  gtdb_arc: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95/gtdb_classify/gtdbtk.ar53.summary.tsv"
  gtdb_bac: "/ei/.project-scratch/5/542de014-1e71-4955-945a-5d2ab09567a7/CEHsoil/MAG_collection/MQ_MAGs_all_0.95/gtdb_classify/gtdbtk.bac120.summary.tsv"

# MAG occurrence across the 1,094 CS samples (1,092 with soil data)
cs_profile:
  cluster_ids: [97, 99]
  otu_table: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_CS2007/data/otu_table.csv"             # samples x OTUs
  taxonomy: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_CS2007/data/taxonomy.csv"
  metadata: "/ei/projects/5/542de014-1e71-4955-945a-5d2ab09567a7/scratch/susbus/data/skyline/results/16S_CS2007/data/CS2007_SOIL_PHYSICOCHEM.csv"  # EIDC 10.5285/79669141-cde5-49f0-b24d-f3c6a1a52db8
  sample_column: "PLOT"
  # environmental zone, country, ITE land class (add a plot-level Broad Habitat / AVC column here when available)
  habitat_columns: ["EZ_DESC_07", "COUNTRY", "LC07"]
  numeric_columns: ["PH", "LOI", "C_CONC_LOI", "MOISTURE", "N_PERCENT", "BULK_DENSITY"]
